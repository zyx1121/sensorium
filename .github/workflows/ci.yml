name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    services:
      # packages/db runs its integration tests when DATABASE_URL is set.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sensorium
          POSTGRES_PASSWORD: sensorium
          POSTGRES_DB: sensorium
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sensorium -d sensorium"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://sensorium:sensorium@localhost:5432/sensorium
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  image:
    uses: zyx1121/.github/.github/workflows/image.yml@main
    permissions:
      contents: read
      packages: write
    with:
      images: '[{"name": "ghcr.io/zyx1121/sensorium"}]'
      smoke: bash deploy/smoke.sh

  promote:
    needs: [check, image]
    uses: zyx1121/.github/.github/workflows/promote.yml@main
    permissions:
      contents: read
      packages: write
    with:
      images: '["ghcr.io/zyx1121/sensorium"]'
