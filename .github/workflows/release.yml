name: release

# A push to main deploys the image ci passed to VM 117 through land: ship
# retags tree-<tree> as sha-<commit> and main, then carrel-deployd on the VM
# runs deploy/carrel-start.sh. A v* tag publishes the SemVer tags and
# :latest for amd64 and arm64.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

jobs:
  ship:
    if: github.ref == 'refs/heads/main'
    uses: zyx1121/.github/.github/workflows/ship.yml@main
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write
    with:
      images: '["ghcr.io/zyx1121/sensorium"]'
      target: land
      tenant: compose
      app: sensorium

  semver:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
